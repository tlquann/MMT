<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Remote Control Dashboard</title>
  <style>
    :root { --bg:#071018; --panel:#111d28e8; --line:#385060; --cyan:#00d9ee; --cyan-soft:#10b9cd; --text:#e8f4f7; --muted:#90a7b0; --danger:#e05563; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color-scheme:dark; }
    * { box-sizing:border-box; } body { min-height:100vh; margin:0; color:var(--text); background:radial-gradient(circle at 70% 8%,#17445055,transparent 33%),linear-gradient(135deg,#060c14,#0b1822 55%,#071018); }
    body::before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.32; background-image:linear-gradient(120deg,transparent 48%,#62d6e322 49%,transparent 50%),radial-gradient(circle at 15% 20%,#71d9e733 0 2px,transparent 3px),radial-gradient(circle at 82% 16%,#71d9e733 0 2px,transparent 3px); background-size:170px 130px,180px 160px,220px 190px; }
    .shell { position:relative; width:min(1180px,calc(100% - 32px)); margin:38px auto; } .account-button { position:absolute; top:0; right:0; display:grid; place-items:center; width:46px; height:46px; padding:0; border-radius:50%; border:1px solid #7deaf5aa; background:#142b38; color:#e9feff; box-shadow:0 0 16px #00d9ee44; } .account-button:hover { background:#1d4858; } .account-button svg { width:24px; height:24px; } .brand { letter-spacing:2px; font-size:clamp(28px,6vw,54px); margin:0 0 22px; text-shadow:0 0 16px #4aeafc99; }
    .panel { background:var(--panel); border:1px solid #b1427366; box-shadow:0 0 0 1px #00d9ee22 inset,0 18px 48px #0008; border-radius:7px; padding:26px; backdrop-filter:blur(8px); }
    .connect-row { display:grid; grid-template-columns:auto 1fr auto; gap:0; align-items:stretch; margin:16px 0 24px; } .protocol { display:flex; align-items:center; padding:0 17px; background:#d3dde0; color:#2a3a43; border-radius:6px 0 0 6px; font-weight:700; }
    input,select,button { font:inherit; } input,select { min-width:0; color:var(--text); background:#25313b; border:1px solid #48606d; padding:13px; outline:none; } input:focus,select:focus { border-color:var(--cyan); box-shadow:0 0 0 3px #00d9ee22; } .connect-row input { border-left:0; border-radius:0; font-size:17px; }
    button { border:1px solid #00d9ee99; background:#052d38; color:var(--cyan); padding:12px 18px; cursor:pointer; border-radius:5px; font-weight:800; letter-spacing:.3px; } button:hover { background:#094a59; } .connect-row button { border-radius:0 6px 6px 0; min-width:145px; box-shadow:0 0 14px #00d9ee66; } button.danger { color:#fff; border-color:#e0556399; background:#6e2833; } button.danger:hover { background:#90313f; }
    .status-line { display:flex; gap:12px; align-items:center; flex-wrap:wrap; color:#c0d0d5; } .badge { display:inline-block; border-radius:4px; padding:4px 9px; font-size:12px; font-weight:800; } .online { background:#087d63; color:#d8fff3; } .offline { background:#5e4950; color:#eee; } .muted { color:var(--muted); }
    #loginDialog { width:min(440px,calc(100% - 32px)); padding:0; color:var(--text); background:#101d28; border:1px solid #49c9d8; border-radius:8px; box-shadow:0 24px 70px #000d; } #loginDialog::backdrop { background:#02070ccc; backdrop-filter:blur(3px); } #loginDialog form { display:grid; gap:13px; padding:28px; } #loginDialog label { display:grid; gap:6px; color:var(--muted); font-size:12px; } #loginDialog input { border-radius:5px; } .dialog-head { display:flex; align-items:center; justify-content:space-between; gap:12px; } .dialog-head h2 { margin:0; } .close-dialog { width:34px; height:34px; padding:0; border-radius:50%; font-size:22px; line-height:1; color:#e9feff; background:#293945; border-color:#65818c; }
    #workspace { display:none; grid-template-columns:210px 1fr; gap:18px; margin-top:18px; } aside,.content-card { background:var(--panel); border:1px solid var(--line); border-radius:7px; box-shadow:0 15px 35px #0007; } aside { padding:12px; } .nav { width:100%; text-align:left; border-color:transparent; background:transparent; color:#aac2ca; box-shadow:none; margin:2px 0; } .nav.active { color:#00151a; background:var(--cyan); border-color:var(--cyan); } .content-card { padding:22px; min-height:390px; }
    .workspace-head,.toolbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between; } .toolbar { justify-content:flex-start; margin:14px 0; } .toolbar input { border-radius:5px; } h2 { margin:0; } table { width:100%; border-collapse:collapse; margin-top:12px; } th,td { padding:11px 8px; text-align:left; border-bottom:1px solid #31434e; } th { color:#8fc8d3; } img.live { display:block; max-width:100%; max-height:67vh; margin-top:15px; border:1px solid #49717b; }
    .metrics { display:flex; flex-wrap:wrap; gap:14px; } .metric { min-width:190px; padding:13px; border:1px solid #385060; border-radius:5px; background:#0d1720; } .bar { height:7px; margin-top:8px; background:#243943; border-radius:5px; overflow:hidden; } .bar i { display:block; height:100%; background:var(--cyan); } pre { white-space:pre-wrap; overflow:auto; }
    .toast { position:fixed; z-index:5; bottom:24px; right:24px; max-width:min(450px,calc(100% - 40px)); background:#075c69; border:1px solid var(--cyan); padding:12px 16px; border-radius:5px; box-shadow:0 10px 32px #000b; } .toast.error { background:#742a36; border-color:#f47a87; }
    @media(max-width:760px) { .shell { margin:20px auto; } .panel { padding:17px; } .connect-row { grid-template-columns:auto 1fr; } .connect-row button { grid-column:1 / -1; border-radius:5px; margin-top:8px; } .connect-row input { border:1px solid #48606d; border-left:0; border-radius:0 5px 5px 0; } #workspace { grid-template-columns:1fr; } aside { display:flex; overflow:auto; } .nav { white-space:nowrap; width:auto; } }
  </style>
</head>
<body>
  <main class="shell">
    <h1 class="brand">DASHBOARD</h1><button id="loginToggle" class="account-button" type="button" aria-label="Mở đăng nhập" aria-expanded="false" onclick="toggleLogin()"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-5.33 0-9.5 2.67-9.5 6v2h19v-2c0-3.33-4.17-6-9.5-6Z"/></svg></button>
    <section class="panel" aria-label="Kết nối Dashboard">
      <label class="muted" for="serverAddress">Nhập địa chỉ Dashboard Server:</label>
      <div class="connect-row"><span class="protocol">http://</span><input id="serverAddress" autocomplete="off" placeholder="127.0.0.1:5000"><button type="button" onclick="connectDashboard()">⚡ Connect</button></div>
      <div class="status-line"><strong>Trạng thái:</strong> <span id="connectionState" class="badge offline">Chưa kết nối</span><span id="lastUpdate" class="muted">Chưa có cập nhật</span></div>
      <dialog id="loginDialog" aria-labelledby="loginTitle"><form id="login" onsubmit="login(event)"><div class="dialog-head"><h2 id="loginTitle">Đăng nhập</h2><button class="close-dialog" type="button" aria-label="Đóng đăng nhập" onclick="closeLogin()">×</button></div><p class="muted">Đăng nhập để quản lý các Client đã kết nối.</p><label>Username<input id="username" value="admin" required></label><label>Password<input id="password" type="password" required></label><button type="submit">Đăng nhập</button></form></dialog>
    </section>
    <section id="workspace">
      <aside>
        <button class="nav active" data-view="applications">Applications</button><button class="nav" data-view="processes">Processes</button><button class="nav" data-view="screen">Screen</button><button class="nav" data-view="files">Files</button><button class="nav" data-view="webcam">Webcam</button><button class="nav" data-view="power">Power</button><button class="nav" data-view="audit">Audit logs</button>
      </aside>
      <article class="content-card"><div class="workspace-head"><div><h2 id="title">Applications</h2><p id="agentState" class="muted">Chưa chọn Client</p></div><div class="toolbar"><select id="agent"></select><button onclick="refreshClients()">Làm mới</button></div></div><div id="content"></div></article>
    </section>
  </main><div id="toast"></div>
  <script>
    let token='', view='applications', streamTimer=null, currentPath='', apiBase='', clients=[];
    const $ = s => document.querySelector(s); const esc = v => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const api = path => apiBase + path; const headers = () => ({'Content-Type':'application/json', Authorization:'Bearer '+token});
    function notify(text,error=false) { $('#toast').innerHTML=`<div class="toast ${error?'error':''}">${esc(text)}</div>`; setTimeout(()=>$('#toast').innerHTML='',3600); }
    function updateStatus(online, text) { const badge=$('#connectionState'); badge.className='badge '+(online?'online':'offline'); badge.textContent=online?'Connected':'Disconnected'; $('#lastUpdate').textContent=text||`Cập nhật: ${new Date().toLocaleTimeString('vi-VN')}`; }
    function toggleLogin(){const dialog=$('#loginDialog');if(dialog.open){dialog.close();return;}dialog.showModal();$('#username').focus();}
    function closeLogin(){$('#loginDialog').close();}    function normalizeAddress(value) { let address=value.trim().replace(/^https?:\/\//,''); if (!address) address=location.host; return location.protocol+'//'+address.replace(/::$/,':'); }
    async function connectDashboard() { apiBase=normalizeAddress($('#serverAddress').value); $('#serverAddress').value=apiBase.replace(/^https?:\/\//,''); updateStatus(false,'Đang kiểm tra kết nối...'); try { const response=await fetch(api('/api/agents')); if (response.status===401 || response.ok) { updateStatus(true); notify('Đã kết nối Dashboard'); } else throw new Error('Máy chủ không phản hồi hợp lệ'); } catch (error) { updateStatus(false,'Không thể kết nối. Kiểm tra IP, cổng hoặc chính sách CORS.'); notify(error.message||'Không thể kết nối',true); } }
    async function login(event) { event.preventDefault(); if (!apiBase) apiBase=location.origin; try { const response=await fetch(api('/api/login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})}); const data=await response.json(); if(!response.ok) throw new Error(data.error||'Đăng nhập thất bại'); token=data.token; updateStatus(true); $('#loginDialog').close(); $('#workspace').style.display='grid'; refreshClients(); } catch(error) { notify(error.message,true); } }
    async function refreshClients() { const response=await fetch(api('/api/agents'),{headers:{Authorization:'Bearer '+token}}); const data=await response.json(); if(!response.ok) return notify(data.error||'Không tải được Client',true); clients=data.agents||[]; agent.innerHTML=clients.map(item=>`<option value="${esc(item.agent_id)}">${esc(item.hostname)} · ${esc(item.agent_id)}</option>`).join(''); $('#agentState').textContent=clients.length?`${clients.length} Client online`:'Không có Client online'; render(); }
    async function command(action,payload={}) { if(!agent.value) { notify('Hãy chọn Client trước',true); return {ok:false}; } const response=await fetch(api(`/api/agents/${encodeURIComponent(agent.value)}/commands`),{method:'POST',headers:headers(),body:JSON.stringify({action,payload})}); const data=await response.json(); if(!response.ok) notify(data.error||'Lệnh thất bại',true); return data; }
    function rows(items,isApplication=false) { return `<div class="toolbar"><input id="search" placeholder="Tìm kiếm" oninput="filterRows()">${isApplication?'<button onclick="openApplication()">Mở ứng dụng</button>':''}</div><table><thead><tr><th>Tên</th><th>PID</th><th>CPU</th><th>RAM</th><th></th></tr></thead><tbody>${items.map(item=>`<tr><td>${esc(item.name)}</td><td>${item.pid}</td><td>${item.cpu_percent??'-'}%</td><td>${item.ram_mb??'-'} MB</td><td><button class="danger" onclick="terminate(${item.pid},'${isApplication?'CLOSE_APPLICATION':'KILL_PROCESS'}')">${isApplication?'Đóng':'Kill'}</button></td></tr>`).join('')}</tbody></table>`; }
    function filterRows(){const q=$('#search').value.toLowerCase();document.querySelectorAll('tbody tr').forEach(row=>row.hidden=!row.innerText.toLowerCase().includes(q));}
    async function openApplication(){const app=prompt('Ứng dụng được phép: notepad hoặc calculator','notepad');if(!app)return;const data=await command('OPEN_APPLICATION',{app});notify(data.ok?'Đã gửi lệnh mở ứng dụng':data.error,!data.ok);}
    async function terminate(pid,action){if(!confirm(`Xác nhận ${action} PID ${pid}?`))return;const data=await command(action,{pid});notify(data.ok?'Thành công':data.error,!data.ok);render();}
    function stopStream(){if(streamTimer){clearInterval(streamTimer);streamTimer=null;}}
    async function render(){stopStream();$('#title').textContent=view[0].toUpperCase()+view.slice(1);if(view==='applications'||view==='processes'){const data=await command(view==='applications'?'LIST_APPLICATIONS':'LIST_PROCESSES');$('#content').innerHTML=data.items?rows(data.items,view==='applications'):'Không thể tải dữ liệu';return;}if(view==='files'){const data=await command('LIST_FILES',{path:currentPath});$('#content').innerHTML=data.ok?`<div class="toolbar"><button onclick="currentPath='';render()">Root</button><span class="muted">${esc(data.root)}\\${esc(data.path)}</span></div><table><thead><tr><th>Tên</th><th>Loại</th><th>Kích thước</th></tr></thead><tbody>${data.items.map(item=>`<tr><td>${esc(item.name)}</td><td>${item.is_dir?`<button onclick="openFolder('${encodeURIComponent(item.name)}')">Folder</button>`:'File'}</td><td>${item.size??'-'}</td></tr>`).join('')}</tbody></table>`:esc(data.error);return;}if(view==='power'){const data=await command('GET_TELEMETRY');$('#content').innerHTML=data.ok?`<div class="metrics"><div class="metric">CPU ${data.cpu_percent}%<div class="bar"><i style="width:${data.cpu_percent}%"></i></div></div><div class="metric">RAM ${data.ram_percent}%<div class="bar"><i style="width:${data.ram_percent}%"></i></div></div></div><p class="muted">Uptime: ${Math.floor(data.uptime_seconds/3600)} giờ · Nhiệt độ: ${data.temperature_c??'Không hỗ trợ'}°C</p><div class="toolbar">${['lock','sleep','restart','shutdown'].map(op=>`<button class="${op==='shutdown'?'danger':''}" onclick="power('${op}')">${op}</button>`).join('')}</div>`:esc(data.error);return;}if(view==='audit'){const response=await fetch(api('/api/audit'),{headers:{Authorization:'Bearer '+token}});const data=await response.json();$('#content').innerHTML='<pre>'+esc(JSON.stringify(data.entries,null,2))+'</pre>';return;}$('#content').innerHTML='<p class="muted">Frame màn hình/camera cần consent cục bộ tại Client.</p><div class="toolbar"><button onclick="startStream()">Start stream</button><button class="danger" onclick="stopStream();notify(\'Đã dừng stream\')">Stop stream</button></div><div id="frame"></div>';}
    function openFolder(name){currentPath=(currentPath?currentPath+'/':'')+decodeURIComponent(name);render();} async function power(operation){if(!confirm(`Xác nhận ${operation} trên Client?`))return;const data=await command('POWER_ACTION',{operation});notify(data.ok?'Đã gửi lệnh':data.error,!data.ok);}
    async function startStream(){const action=view==='screen'?'SCREEN_SNAPSHOT':'WEBCAM_SNAPSHOT';async function frame(){const data=await command(action);if(data.ok)$('#frame').innerHTML=`<img class="live" src="data:image/jpeg;base64,${data.image_base64}">`;else{notify(data.error,true);stopStream();}}await frame();streamTimer=setInterval(frame,900);}
    $('#serverAddress').value=location.host; document.querySelectorAll('.nav').forEach(button=>button.onclick=()=>{document.querySelector('.nav.active').classList.remove('active');button.classList.add('active');view=button.dataset.view;render();});
  </script>
</body>
</html>
