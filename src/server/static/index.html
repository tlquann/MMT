<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Remote Admin</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#e6edf7;font:14px system-ui;display:grid;grid-template-columns:232px 1fr;min-height:100vh}aside{padding:24px 14px;background:#121a2b;border-right:1px solid #24304a}.brand{font-weight:800;letter-spacing:1px;color:#87b6ff;margin:0 10px 28px}button,input,select{border:1px solid #334155;background:#19243a;color:#e6edf7;border-radius:7px;padding:9px}button{cursor:pointer;background:#2563eb;border:0}button:hover{background:#3b82f6}.nav{width:100%;text-align:left;background:transparent;margin:3px 0}.nav.active{background:#253b61}.danger{background:#b91c1c}.danger:hover{background:#dc2626}main{padding:26px;max-width:1500px;width:100%}.card{background:#121a2b;border:1px solid #24304a;padding:18px;border-radius:12px;margin-top:16px}.header{display:flex;gap:12px;align-items:center;justify-content:space-between}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.metric{display:inline-block;min-width:180px;margin:6px 10px 6px 0}.bar{height:9px;border-radius:8px;background:#26344e;overflow:hidden}.bar i{display:block;background:#38bdf8;height:100%}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{padding:10px;border-bottom:1px solid #26344e;text-align:left}th{color:#9fb0ce}img.live{max-width:100%;max-height:72vh;border-radius:8px;background:#030712}.toast{position:fixed;right:18px;bottom:18px;background:#2563eb;padding:12px 16px;border-radius:8px;box-shadow:0 8px 24px #0008;z-index:4}.error{background:#b91c1c}.muted{color:#9fb0ce}.hidden{display:none}@media(max-width:700px){body{grid-template-columns:1fr}aside{display:flex;overflow:auto;gap:4px;padding:10px}.brand{display:none}.nav{width:auto;white-space:nowrap}main{padding:14px}}
</style></head><body>
<aside><div class="brand">REMOTE ADMIN</div><button class="nav active" data-view="applications">▣ Applications</button><button class="nav" data-view="processes">◉ Processes</button><button class="nav" data-view="screen">▣ Screen</button><button class="nav" data-view="files">▤ Files</button><button class="nav" data-view="webcam">◉ Webcam</button><button class="nav" data-view="power">⚡ Power</button><button class="nav" data-view="audit">☷ Audit logs</button></aside>
<main><section id="login" class="card"><h1>Đăng nhập quản trị</h1><p class="muted">Xác thực trước khi truy cập máy trong mạng LAN.</p><input id="username" placeholder="Username" value="admin"><input id="password" type="password" placeholder="Password"><button onclick="login()">Đăng nhập</button></section>
<section id="dashboard" class="hidden"><div class="header"><div><h1 id="title">Applications</h1><span class="muted" id="state">Chưa chọn Agent</span></div><div class="toolbar"><select id="agent"></select><button onclick="refreshAgents()">Làm mới Agent</button></div></div><div id="content" class="card"></div></section><div id="toast"></div></main>
<script>
let token='',view='applications',streamTimer=null,currentPath='';const $=s=>document.querySelector(s);const esc=value=>String(value).replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));function notice(text,error=false){$('#toast').innerHTML=`<div class="toast ${error?'error':''}">${esc(text)}</div>`;setTimeout(()=>$('#toast').innerHTML='',3200)}function stopStream(){if(streamTimer){clearInterval(streamTimer);streamTimer=null}}function headers(){return{'Content-Type':'application/json',Authorization:'Bearer '+token}}async function login(){let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})}),d=await r.json();if(!r.ok)return notice(d.error,true);token=d.token;$('#login').classList.add('hidden');$('#dashboard').classList.remove('hidden');refreshAgents()}async function refreshAgents(){let r=await fetch('/api/agents',{headers:{Authorization:'Bearer '+token}}),d=await r.json();agent.innerHTML=(d.agents||[]).map(a=>`<option value="${esc(a.agent_id)}">${esc(a.agent_id)} · ${esc(a.hostname)}</option>`).join('');$('#state').textContent=d.agents?.length?'Agent online':'Không có Agent online';render()}async function command(action,payload={}){if(!agent.value)return notice('Hãy kết nối Agent trước',true);let r=await fetch(`/api/agents/${encodeURIComponent(agent.value)}/commands`,{method:'POST',headers:headers(),body:JSON.stringify({action,payload})}),d=await r.json();if(!r.ok)notice(d.error||'Lệnh thất bại',true);return d}function rows(items,application=false){return `<input id="search" placeholder="Tìm kiếm" oninput="filterRows()"><table><thead><tr><th>Tên</th><th>PID</th><th>CPU %</th><th>RAM MB</th><th>Thao tác</th></tr></thead><tbody>${items.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.pid}</td><td>${x.cpu_percent??'-'}</td><td>${x.ram_mb??'-'}</td><td><button class="danger" onclick="terminate(${x.pid},'${application?'CLOSE_APPLICATION':'KILL_PROCESS'}')">${application?'Đóng':'Kill'}</button></td></tr>`).join('')}</tbody></table>`}function filterRows(){let q=search.value.toLowerCase();document.querySelectorAll('tbody tr').forEach(r=>r.hidden=!r.innerText.toLowerCase().includes(q))}async function terminate(pid,action){if(confirm(`Xác nhận ${action} PID ${pid}?`)){let d=await command(action,{pid});notice(d.ok?'Thành công':d.error,!d.ok);render()}}async function render(){stopStream();$('#title').textContent=view[0].toUpperCase()+view.slice(1);if(view==='applications'||view==='processes'){let d=await command(view==='applications'?'LIST_APPLICATIONS':'LIST_PROCESSES');$('#content').innerHTML=d.items?rows(d.items,view==='applications'):'Không thể tải dữ liệu';}else if(view==='files'){let d=await command('LIST_FILES',{path:currentPath});$('#content').innerHTML=d.ok?`<div class=toolbar><button onclick="currentPath='';render()">Root</button><span class=muted>${esc(d.root)}\${esc(d.path)}</span></div><table><thead><tr><th>Tên</th><th>Loại</th><th>Kích thước</th></tr></thead><tbody>${d.items.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.is_dir?`<button onclick="openFolder('${encodeURIComponent(x.name)}')">Folder</button>`:'File'}</td><td>${x.size??'-'}</td></tr>`).join('')}</tbody></table>`:esc(d.error);}else if(view==='power'){let d=await command('GET_TELEMETRY');$('#content').innerHTML=d.ok?`<div class=metric>CPU ${d.cpu_percent}%<div class=bar><i style="width:${d.cpu_percent}%"></i></div></div><div class=metric>RAM ${d.ram_percent}%<div class=bar><i style="width:${d.ram_percent}%"></i></div></div><p>Uptime: ${Math.floor(d.uptime_seconds/3600)} giờ · Nhiệt độ: ${d.temperature_c??'Không hỗ trợ'} °C</p><div class=toolbar>${['lock','sleep','restart','shutdown'].map(x=>`<button class="${x==='shutdown'?'danger':''}" onclick="power('${x}')">${x}</button>`).join('')}</div>`:esc(d.error);}else if(view==='audit'){let r=await fetch('/api/audit',{headers:{Authorization:'Bearer '+token}}),d=await r.json();$('#content').innerHTML='<pre>'+esc(JSON.stringify(d.entries,null,2))+'</pre>';}else{$('#content').innerHTML='<p class=muted>Livestream được tạo bằng các frame liên tiếp qua Agent WebSocket. Nhấn Start để kích hoạt.</p><div class=toolbar><button onclick="startStream()">Start stream</button><button class=danger onclick="stopStream();notice(\'Đã dừng stream\')">Stop stream</button></div><p id=frame></p>'}}function openFolder(name){currentPath=(currentPath?currentPath+'/':'')+decodeURIComponent(name);render()}async function power(operation){if(confirm(`Xác nhận ${operation}?`)){let d=await command('POWER_ACTION',{operation});notice(d.ok?'Đã gửi lệnh':d.error,!d.ok)}}async function startStream(){let action=view==='screen'?'SCREEN_SNAPSHOT':'WEBCAM_SNAPSHOT';async function frame(){let d=await command(action);if(d.ok)$('#frame').innerHTML=`<img class=live src="data:image/jpeg;base64,${d.image_base64}">`;else{notice(d.error,true);stopStream()}}await frame();streamTimer=setInterval(frame,900);notice('Stream đang chạy')}document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{document.querySelector('.nav.active').classList.remove('active');b.classList.add('active');view=b.dataset.view;render()});
</script></body></html>
